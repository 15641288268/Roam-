name: Roam iOS unsigned IPA
on:
  workflow_dispatch:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-unsigned-ipa.yml'
jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate --spec Project.yml
      - name: Build unsigned iPhone app
        working-directory: ios
        run: |
          xcodebuild -project Roam.xcodeproj -scheme Roam -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA for Windows signing
        run: |
          mkdir -p Payload
          cp -R ios/build/Build/Products/Release-iphoneos/Roam.app Payload/
          zip -qry Roam-unsigned.ipa Payload
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Roam-iOS-unsigned-IPA
          path: Roam-unsigned.ipa
          retention-days: 30
